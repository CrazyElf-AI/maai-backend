<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | MAAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif']
                    },
                    colors: { brand: { teal: '#0d9488', orange: '#f97316', blue: '#2563eb' } }
                }
            }
        }
    </script>
    <style>
        /* Custom Animations for the 404 Page */
        .pulse-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(13, 148, 136, 0.4); transform: scale(1); }
            50% { text-shadow: 0 0 40px rgba(13, 148, 136, 0.8), 0 0 80px rgba(13, 148, 136, 0.4); transform: scale(1.05); }
        }
        .floating { animation: floating 4s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="bg-[#030712] text-gray-200 antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] bg-brand-teal/20 rounded-full filter blur-[100px] opacity-50 z-0 pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-brand-orange/10 rounded-full filter blur-[100px] opacity-30 z-0 pointer-events-none"></div>
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-60 z-0 pointer-events-none"></div>

    <div class="container mx-auto px-4 relative z-10 text-center">
        
        <div class="mb-8 floating">
            <h1 class="font-display text-8xl md:text-[10rem] font-extrabold text-white tracking-tighter flex items-center justify-center gap-2 md:gap-6">
                <span>4</span>
                <i class="fas fa-heartbeat text-brand-teal pulse-glow text-7xl md:text-9xl"></i>
                <span>4</span>
            </h1>
        </div>

        <span class="inline-block bg-brand-teal/10 text-brand-teal border border-brand-teal/20 font-bold px-4 py-1.5 rounded-full text-sm mb-6 uppercase tracking-wider shadow-[0_0_15px_rgba(13,148,136,0.2)]">
            Code Blue: Page Missing
        </span>

        <h2 class="text-3xl md:text-5xl font-bold text-white mb-6 font-display">
            Oops! We couldn't find a <span class="text-brand-teal">pulse</span> here.
        </h2>
        
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed font-sans">
            The page you are looking for seems to have flatlined, moved to a different ward, or never existed at all. Let's get you back to safety.
        </p>
        
    </div>
</body>
</html>
